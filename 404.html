<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YijiaMango WebRTC</title>
    <script src="https://webrtc.github.io/adapter/adapter-latest.js"></script>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background: #000;
            overflow: hidden;
            caret-color: transparent;
        }

        #preview-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            min-height: 132px;
            background: #0b0b0b;
            border-bottom: 1px solid #1f1f1f;
            z-index: 50;
            display: none;
            user-select: none;
        }

        #preview-strip {
            min-height: 132px;
            display: flex;
            gap: 10px;
            align-items: flex-start;
            align-content: flex-start;
            flex-wrap: wrap;
            padding: 10px 12px;
            overflow-x: hidden;
            overflow-y: auto;
            box-sizing: border-box;
        }

        /* GH entry：整頁由上到下多窗快照 */
        body.hub-entry {
            overflow: auto;
        }
        body.hub-entry #preview-header {
            display: block !important;
            inset: 0;
            min-height: 100%;
            height: 100%;
            border-bottom: 0;
            z-index: 100;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        body.hub-entry #preview-strip {
            display: grid;
            grid-template-columns: 1fr 1fr;
            align-content: start;
            min-height: 100%;
            height: auto;
            gap: 10px;
            padding: 10px;
            box-sizing: border-box;
        }
        body.hub-entry .preview-card {
            flex: unset;
            width: 100%;
            max-width: 100%;
            min-width: 0;
            aspect-ratio: 1 / 1;
        }
        body.hub-entry .preview-card .preview-snap {
            object-fit: cover;
        }
        body.hub-entry .preview-card iframe,
        body.hub-entry .preview-card .preview-snap {
            pointer-events: none;
        }
        .preview-card .preview-snap {
            width: 100%;
            height: 100%;
            object-fit: fill;
            display: none !important;
            background: #111;
            border: 0;
        }
        .preview-card .preview-snap.is-live {
            display: block !important;
        }
        .preview-card .preview-placeholder {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            color: #9a9a9a;
            font-size: 15px;
            letter-spacing: 0.04em;
            background: #111;
            pointer-events: none;
            z-index: 1;
        }
        .preview-card.has-live .preview-placeholder {
            display: none;
        }
        body.hub-entry #fullscreen-container,
        body.hub-entry #connect-panel,
        body.hub-entry #osc-hud,
        body.hub-entry #osc-enable-btn,
        body.hub-entry #td-signal-hud {
            display: none !important;
        }

        .preview-card {
            flex: 1 1 180px;
            min-width: 110px;
            max-width: 100%;
            aspect-ratio: 16 / 9;
            height: auto;
            border: 1px solid #333;
            border-radius: 8px;
            overflow: hidden;
            background: #000;
            color: #d0d0d0;
            text-decoration: none;
            position: relative;
            outline: none;
        }

        .preview-card:focus,
        .preview-card:focus-visible,
        iframe:focus,
        iframe:focus-visible {
            outline: none;
        }

        .preview-card iframe {
            width: 100%;
            height: 100%;
            border: 0;
            background: #000;
            object-fit: fill;
        }

        .preview-card-label {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 22px;
            line-height: 22px;
            background: rgba(0, 0, 0, 0.75);
            font-size: 12px;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding: 0 6px;
            box-sizing: border-box;
        }

        #fullscreen-container {
            width: 100vw;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            background: #000;
            overflow: hidden;
        }

        #remoteVideo {
            width: 100%;
            height: 100%;
            display: block;
            background: #000;
            object-fit: fill;
            transform: none !important;
            opacity: 0;
            pointer-events: none;
        }

        #freezeFrameCanvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
            background: #111;
            z-index: 10;
            object-fit: fill;
            transform: none !important;
        }

        #td-signal-hud {
            position: fixed;
            left: 8px;
            bottom: 8px;
            max-width: min(96vw, 520px);
            max-height: 38vh;
            overflow: auto;
            z-index: 120;
            padding: 8px 10px;
            font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            color: #c8f0c8;
            background: rgba(0, 24, 0, 0.82);
            border: 1px solid #2a6a2a;
            border-radius: 6px;
            pointer-events: none;
            white-space: pre-wrap;
            word-break: break-all;
        }

        #td-signal-hud kbd {
            color: #9fdf9f;
        }

        #osc-hud {
            position: fixed;
            right: 8px;
            bottom: 8px;
            z-index: 121;
            max-width: min(92vw, 280px);
            padding: 8px 10px;
            border-radius: 6px;
            background: rgba(0, 12, 28, 0.82);
            color: #d0e8ff;
            font: 11px/1.35 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            border: 1px solid #2a4a8a;
            white-space: pre-wrap;
            pointer-events: none;
        }

        #osc-enable-btn {
            position: fixed;
            left: 50%;
            bottom: 18px;
            transform: translateX(-50%);
            z-index: 122;
            padding: 12px 18px;
            border: none;
            border-radius: 999px;
            background: #3d7eff;
            color: #fff;
            font: 14px/1.2 "Segoe UI", "PingFang TC", "Noto Sans TC", sans-serif;
            letter-spacing: 0.04em;
            cursor: pointer;
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.35);
        }

        #osc-enable-btn[hidden] {
            display: none !important;
        }

        #wanVideo {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: fill;
            background: #000;
            display: none;
            z-index: 15;
            transform: none !important;
        }

        #wanVideo.show {
            display: block;
        }

        #connect-panel {
            position: fixed;
            inset: 0;
            z-index: 200;
            display: none;
            place-items: center;
            background:
                radial-gradient(ellipse at 30% 20%, rgba(61, 126, 255, 0.18), transparent 50%),
                #0a0c10;
            color: #e8eef8;
            font-family: "Segoe UI", "PingFang TC", "Noto Sans TC", sans-serif;
            padding: 24px;
            box-sizing: border-box;
        }

        #connect-panel.show {
            display: grid;
        }

        #connect-card {
            width: min(420px, 100%);
            background: rgba(16, 20, 28, 0.92);
            border: 1px solid rgba(120, 160, 220, 0.28);
            border-radius: 16px;
            padding: 22px 20px 18px;
            box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
        }

        #connect-card h1 {
            margin: 0 0 6px;
            font-size: 1.25rem;
            font-weight: 650;
            letter-spacing: 0.04em;
        }

        #connect-card p {
            margin: 0 0 16px;
            color: #9aa8bc;
            font-size: 0.9rem;
            line-height: 1.5;
        }

        #connect-card label {
            display: block;
            margin: 0 0 6px;
            font-size: 0.78rem;
            color: #8fa0b8;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        #connect-card input {
            width: 100%;
            box-sizing: border-box;
            margin: 0 0 12px;
            padding: 11px 12px;
            border-radius: 10px;
            border: 1px solid rgba(120, 160, 220, 0.28);
            background: #0b1018;
            color: #e8eef8;
            font-size: 15px;
        }

        #connect-card .row {
            display: grid;
            grid-template-columns: 1fr 100px;
            gap: 10px;
        }

        #connect-go {
            width: 100%;
            margin-top: 4px;
            padding: 12px 14px;
            border: none;
            border-radius: 999px;
            background: #3d7eff;
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            letter-spacing: 0.04em;
        }

        #connect-go:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        #connect-status {
            margin: 12px 0 0;
            min-height: 1.2em;
            font-size: 0.85rem;
            color: #f0b4b4;
            white-space: pre-wrap;
        }

        #connect-status.ok {
            color: #9fd89f;
        }
    </style>
</head>
<body>
    <header id="preview-header">
        <div id="preview-strip"></div>
    </header>
    <div id="fullscreen-container">
        <video id="remoteVideo" playsinline autoplay muted></video>
        <canvas id="freezeFrameCanvas"></canvas>
        <img id="wanVideo" alt="WAN live" draggable="false" />
    </div>
    <div id="connect-panel" aria-hidden="true">
        <div id="connect-card">
            <h1>MyWebRTC</h1>
            <p>短網址：<code style="color:#9ec1ff">https://yijiamango.github.io/MyWebRTC/321</code><br>外網自動接 Zrok，通常不必填下面。</p>
            <label for="connect-ws">Signaling Host（覆寫用，可留空）</label>
            <input id="connect-ws" type="text" autocomplete="off" spellcheck="false" placeholder="自動 yijiamango{port}.share.zrok.io" />
            <div class="row">
                <div>
                    <label for="connect-port">TD Port（通道）</label>
                    <input id="connect-port" type="text" inputmode="numeric" value="321" />
                </div>
                <div style="align-self:end;padding-bottom:12px;color:#6f7f96;font-size:12px;text-align:center;line-height:1.3;">與 TD<br>同步</div>
            </div>
            <button id="connect-go" type="button">連接並收看</button>
            <div id="connect-status"></div>
        </div>
    </div>
    <div id="td-signal-hud" hidden><kbd>tdsignal</kbd> 等待 JSON…</div>
    <div id="osc-hud" hidden>OSC 待命</div>
    <button id="osc-enable-btn" type="button" hidden>啟用姿態感測 → OSC</button>

    <script>
        const defaultPort = 450;
        const remoteVideo = document.getElementById("remoteVideo");
        const freezeFrameCanvas = document.getElementById("freezeFrameCanvas");
        const freezeCtx = freezeFrameCanvas.getContext("2d", { alpha: false });
        const fullscreenContainer = document.getElementById("fullscreen-container");
        const previewHeader = document.getElementById("preview-header");
        const previewStrip = document.getElementById("preview-strip");

        let signalingClient = null;
        let webRTCConnection = null;
        let myId = null;
        let initialClientListReceived = false;
        let reconnectTimer = null;
        let reconnectAttempts = 0;
        // TD 關檔 / about:blank 時設 true，擋掉重連迴圈拖死 CEF
        window.__tdShuttingDown = false;
        let isConnecting = false;
        let lastConnectAttemptAt = 0;
        let wsHost = "";
        let wsPort = defaultPort;
        let connectWatchdogTimer = null;
        let mediaWatchdogTimer = null;
        let lastTrackAt = 0;
        let hasFrozenFrame = false;
        let lastSnapshotAt = 0;
        let snapshotIntervalTimer = null;
        let frameCaptureLoopActive = false;

        const reconnectConfig = {
            // 已停用自動重連（避免 currentClients 暴增）
            retryDelaysMs: [],
            minConnectIntervalMs: 0,
            maxAttempts: 0
        };
        const watchdogConfig = {
            connectTimeoutMs: 8000,
            noVideoTimeoutMs: 8000
        };
        const urlParams = new URLSearchParams(window.location.search);
        const isThumbnailMode = urlParams.get("thumb") === "1";
        const onGithubPagesEarly = /\.github\.io$/i.test(window.location.hostname);

        /** GH Pages: /MyWebRTC/ → base=/MyWebRTC/ ；本機 TD: / → base=/ */
        function getAppBasePath() {
            const parts = window.location.pathname.split("/").filter(Boolean);
            if (onGithubPagesEarly && parts.length >= 1) {
                return "/" + parts[0] + "/";
            }
            return "/";
        }

        /**
         * 通道號：
         *   /MyWebRTC/321
         *   /MyWebRTC/port/321
         *   ?port=321（相容）
         */
        function parseTdPortFromLocation() {
            const q = (urlParams.get("port") || "").trim();
            if (q && /^\d{1,6}$/.test(q) && q !== "443") {
                return q;
            }
            const parts = window.location.pathname.split("/").filter(Boolean);
            let segs = parts.slice();
            if (onGithubPagesEarly && segs.length) {
                segs = segs.slice(1);
            }
            if (segs.length >= 2 && segs[0].toLowerCase() === "port" && /^\d{1,6}$/.test(segs[1])) {
                return segs[1];
            }
            if (segs.length === 1 && /^\d{1,6}$/.test(segs[0])) {
                return segs[0];
            }
            return "";
        }

        /** 入口頁：/MyWebRTC/ 或 /MyWebRTC（無通道 path；index/404 也算入口） */
        function isHubEntryPath() {
            if (isThumbnailMode) {
                return false;
            }
            if (parseTdPortFromLocation()) {
                return false;
            }
            const parts = window.location.pathname.split("/").filter(Boolean);
            let segs = parts.slice();
            if (onGithubPagesEarly && segs.length) {
                segs = segs.slice(1);
            }
            if (segs.length === 0) {
                return true;
            }
            if (segs.length === 1 && /^(index|404)\.html$/i.test(segs[0])) {
                return true;
            }
            return false;
        }

        const appBasePath = getAppBasePath();
        const pathTdPort = parseTdPortFromLocation();
        const onZrokHost = /\.share\.zrok\.io$/i.test(window.location.hostname);
        // GH 入口 或 Zrok 5757 根路徑（無 ?port=）= 多窗首頁
        const isHubEntry = isHubEntryPath() && (onGithubPagesEarly || onZrokHost);

        // 本機 TD WebServer root 總覽（非 GH、非 Zrok）
        const isRootOverviewPage =
            !onGithubPagesEarly &&
            !onZrokHost &&
            window.location.pathname === "/" &&
            !urlParams.get("port") &&
            !urlParams.get("ws") &&
            !pathTdPort;
        const shouldAllowFullscreen = !isThumbnailMode && !isRootOverviewPage && !isHubEntry;
        // ?osc=0 關閉；預設開（thumb/overview/入口 除外）
        const oscBridgeEnabled =
            urlParams.get("osc") !== "0" && !isThumbnailMode && !isRootOverviewPage && !isHubEntry;
        // 外網：每頻道 feed=該 signal zrok（各自 live.jpg），不再共用 5757
        function defaultWsHostForPort(port) {
            const p = String(port || "321").replace(/\D/g, "") || "321";
            return `yijiamango${p}.share.zrok.io`;
        }
        function defaultFeedForPort(port) {
            return "https://" + defaultWsHostForPort(port);
        }
        const channelPortForFeed = pathTdPort || urlParams.get("port") || defaultPort;
        let feedBase = (urlParams.get("feed") || "").trim().replace(/\/$/, "");
        // GH 短網址 / Zrok web ?port= ：feed 預設 = 該頻道 signal（不必再寫 ws）
        if (!feedBase && !isHubEntry && (onGithubPagesEarly || (onZrokHost && channelPortForFeed))) {
            feedBase = defaultFeedForPort(channelPortForFeed);
        }
        const wanFps = Math.max(15, Math.min(60, Number(urlParams.get("fps") || 30) || 30));
        // 頻道頁預設外網；hub 首頁不進 WAN
        const forceWan =
            !isHubEntry &&
            (urlParams.get("wan") === "1" ||
                urlParams.get("pipe") === "http" ||
                urlParams.get("pipe") === "ws" ||
                onZrokHost ||
                (onGithubPagesEarly && urlParams.get("wan") !== "0"));
        const previewScanFrom = Number(urlParams.get("thumbFrom") || 301);
        const previewScanTo = Number(urlParams.get("thumbTo") || 0);
        const previewScanChunk = Math.max(5, Number(urlParams.get("thumbChunk") || 40));
        const previewMissStop = Math.max(5, Number(urlParams.get("thumbMissStop") || 30));
        const previewHardMax = Math.max(previewScanFrom, Number(urlParams.get("thumbMax") || 2000));
        const previewRefreshMs = Number(urlParams.get("thumbRefreshMs") || (isHubEntry ? 30000 : 5000));
        let hubStickyPorts = [];
        const hubPortMiss = Object.create(null);
        const signalPollMs = Number(urlParams.get("signalPollMs") ?? 250);
        // 預設不顯示 JSON 浮層；除錯時網址加 ?signalHud=1
        const signalHudEnabled = urlParams.get("signalHud") === "1" && !isThumbnailMode;
        // TD DataChannel 高頻 JSON 會塞爆主執行緒，易與影片解碼互搶造成卡頓；加 ?tdDcCoalesce=1 改為每幀最多派送一次（取最新一筆）
        const tdDcCoalesce = urlParams.get("tdDcCoalesce") === "1";
        let previewRefreshTimer = null;
        let previewSnapTimers = [];
        let lastRenderedPreviewKey = "";

        function clearPreviewSnapTimers() {
            previewSnapTimers.forEach((id) => {
                clearInterval(id);
                clearTimeout(id);
            });
            previewSnapTimers = [];
        }
        let tdSignalTimer = null;
        let lastTdSignalSeq = -1;
        let pendingTdSignalFromDc = null;
        let tdSignalDcRafId = null;
        let linkBeatTimer = null;
        let linkSeq = 0;
        let oscDataChannel = null;
        let oscSeq = 0;
        let oscRafId = null;
        let oscSensorsLive = false;
        let latestOrient = null;
        let latestMotion = null;
        let lastOscHudAt = 0;
        let wanTimer = null;
        let wanWs = null;
        let wanActive = false;
        let wanBusy = false;
        let wanMode = ""; // "ws" | "jpg"
        const wanVideo = document.getElementById("wanVideo");

        function linkStatusName() {
            const port = (urlParams.get("port") || "").trim();
            if (port && /^[0-9]{1,6}$/.test(port)) {
                return `td_link_${port}.json`;
            }
            return "td_link.json";
        }

        function collectLinkState() {
            const sigOpen = signalingClient?.webSocket?.readyState === WebSocket.OPEN;
            const pc = webRTCConnection?.peerConnection || null;
            const pcState = pc ? String(pc.connectionState || "") : "none";
            const iceState = pc ? String(pc.iceConnectionState || "") : "none";
            const live = hasLiveVideo();
            // 斷線判定：不看畫面像素，只看連線狀態
            const ok = Boolean(
                sigOpen &&
                live &&
                (pcState === "connected" || pcState === "connecting")
            );
            return {
                ok: ok ? 1 : 0,
                signaling: sigOpen ? 1 : 0,
                live: live ? 1 : 0,
                pc: pcState,
                ice: iceState,
                seq: ++linkSeq,
                t: Date.now(),
                port: urlParams.get("port") || "",
            };
        }

        async function postLinkState(extra) {
            if (isThumbnailMode || isRootOverviewPage) {
                return;
            }
            const body = Object.assign(collectLinkState(), extra || {});
            try {
                const u = new URL(linkStatusName(), window.location.href);
                await fetch(u.toString(), {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(body),
                    cache: "no-store",
                    keepalive: true,
                });
            } catch (e) {
                // ignore — Server 端超時就當斷線
            }
        }

        function startLinkHeartbeat() {
            if (isThumbnailMode || isRootOverviewPage) {
                return;
            }
            if (linkBeatTimer) {
                clearInterval(linkBeatTimer);
            }
            postLinkState();
            linkBeatTimer = setInterval(() => {
                if (window.__tdShuttingDown) {
                    return;
                }
                postLinkState();
            }, 500);
        }

        function stopLinkHeartbeat(finalDead) {
            if (linkBeatTimer) {
                clearInterval(linkBeatTimer);
                linkBeatTimer = null;
            }
            if (finalDead) {
                postLinkState({ ok: 0, live: 0, dead: 1 });
            }
        }

        function log(msg, type = "info") {
            const prefix = type.toUpperCase();
            console.log(`[${prefix}] ${msg}`);
        }

        function dispatchTdSignalFromDc(data) {
            const seq = Number(data.seq);
            if (Number.isFinite(seq)) {
                if (seq === lastTdSignalSeq) {
                    return;
                }
                lastTdSignalSeq = seq;
            }
            window.dispatchEvent(new CustomEvent("tdsignal", { detail: data }));
        }

        function flushPendingTdSignalFromDc() {
            tdSignalDcRafId = null;
            if (pendingTdSignalFromDc === null) {
                return;
            }
            const data = pendingTdSignalFromDc;
            pendingTdSignalFromDc = null;
            dispatchTdSignalFromDc(data);
        }

        /** TD 端用 Outgoing DataChannel 送 UTF-8 JSON 字串時，由此轉成與 signal.json 相同的 tdsignal 事件 */
        function wireDataChannelToTdSignal(channel) {
            channel.onmessage = (ev) => {
                if (typeof ev.data !== "string") {
                    return;
                }
                const raw = ev.data.trim();
                if (!raw || raw[0] !== "{") {
                    return;
                }
                let data;
                try {
                    data = JSON.parse(raw);
                } catch (_) {
                    return;
                }
                if (tdDcCoalesce) {
                    const seq = Number(data.seq);
                    if (Number.isFinite(seq) && seq === lastTdSignalSeq) {
                        return;
                    }
                    pendingTdSignalFromDc = data;
                    if (tdSignalDcRafId === null) {
                        tdSignalDcRafId = requestAnimationFrame(flushPendingTdSignalFromDc);
                    }
                    return;
                }
                dispatchTdSignalFromDc(data);
            };
        }

        function setOscHud(_text) {
            // 畫面保持乾淨：不顯示 OSC HUD
        }

        function flushOscPayload() {
            oscRafId = null;
            if (!oscBridgeEnabled || !oscDataChannel || oscDataChannel.readyState !== "open") {
                return;
            }
            if (!latestOrient && !latestMotion) {
                return;
            }
            const payload = {
                t: Date.now(),
                seq: ++oscSeq,
                orient: latestOrient,
                accel: latestMotion ? latestMotion.accel : null,
                accelG: latestMotion ? latestMotion.accelG : null,
                rotRate: latestMotion ? latestMotion.rotRate : null
            };
            try {
                oscDataChannel.send(JSON.stringify(payload));
            } catch (e) {
                return;
            }
            const now = Date.now();
            if (now - lastOscHudAt > 250) {
                lastOscHudAt = now;
                const o = latestOrient || {};
                setOscHud(
                    `OSC↑ seq=${payload.seq}\n` +
                    `α=${Number(o.alpha || 0).toFixed(1)} β=${Number(o.beta || 0).toFixed(1)} γ=${Number(o.gamma || 0).toFixed(1)}`
                );
            }
        }

        function queueOscSend() {
            if (!oscBridgeEnabled) {
                return;
            }
            if (oscRafId !== null) {
                return;
            }
            oscRafId = requestAnimationFrame(flushOscPayload);
        }

        function onDeviceOrientation(ev) {
            latestOrient = {
                alpha: ev.alpha == null ? 0 : ev.alpha,
                beta: ev.beta == null ? 0 : ev.beta,
                gamma: ev.gamma == null ? 0 : ev.gamma,
                absolute: Boolean(ev.absolute)
            };
            queueOscSend();
        }

        function onDeviceMotion(ev) {
            const a = ev.acceleration || {};
            const ag = ev.accelerationIncludingGravity || {};
            const rr = ev.rotationRate || {};
            latestMotion = {
                accel: { x: a.x || 0, y: a.y || 0, z: a.z || 0 },
                accelG: { x: ag.x || 0, y: ag.y || 0, z: ag.z || 0 },
                rotRate: { alpha: rr.alpha || 0, beta: rr.beta || 0, gamma: rr.gamma || 0 }
            };
            queueOscSend();
        }

        async function enableMotionSensors() {
            if (!oscBridgeEnabled || oscSensorsLive) {
                return true;
            }
            try {
                if (
                    typeof DeviceOrientationEvent !== "undefined" &&
                    typeof DeviceOrientationEvent.requestPermission === "function"
                ) {
                    const st = await DeviceOrientationEvent.requestPermission();
                    if (st !== "granted") {
                        setOscHud("姿態權限被拒（Orientation）");
                        return false;
                    }
                }
                if (
                    typeof DeviceMotionEvent !== "undefined" &&
                    typeof DeviceMotionEvent.requestPermission === "function"
                ) {
                    try {
                        await DeviceMotionEvent.requestPermission();
                    } catch (e) {}
                }
            } catch (err) {
                setOscHud("姿態權限失敗：" + (err && err.message ? err.message : err));
                return false;
            }
            window.addEventListener("deviceorientation", onDeviceOrientation, true);
            window.addEventListener("devicemotion", onDeviceMotion, true);
            oscSensorsLive = true;
            log("DeviceOrientation / DeviceMotion 已啟用", "success");
            return true;
        }

        function armOscTapToEnable() {
            if (!oscBridgeEnabled || oscSensorsLive) {
                return;
            }
            const bootSensors = (ev) => {
                const t = ev && ev.target;
                if (t && typeof t.closest === "function" && t.closest("#connect-panel")) {
                    return;
                }
                enableMotionSensors();
                document.removeEventListener("pointerdown", bootSensors, true);
                document.removeEventListener("click", bootSensors, true);
                document.removeEventListener("touchstart", bootSensors, true);
            };
            document.addEventListener("pointerdown", bootSensors, { capture: true });
            document.addEventListener("click", bootSensors, { capture: true });
            document.addEventListener("touchstart", bootSensors, { capture: true });
        }

        function needsMotionPermissionPrompt() {
            return (
                typeof DeviceOrientationEvent !== "undefined" &&
                typeof DeviceOrientationEvent.requestPermission === "function"
            );
        }

        function wireOscDataChannel(channel) {
            oscDataChannel = channel;
            channel.onopen = () => {
                log("DataChannel 已開啟: OscData", "success");
                setOscHud(oscSensorsLive ? "OscData open — 推送中" : "OscData open — 請啟用姿態");
                if (oscSensorsLive) {
                    queueOscSend();
                }
            };
            channel.onclose = () => {
                if (oscDataChannel === channel) {
                    oscDataChannel = null;
                }
                setOscHud("OscData closed");
            };
            channel.onerror = () => {
                log("OscData DataChannel error", "error");
            };
        }

            if (!shouldAllowFullscreen) {

            const el = fullscreenContainer;
            if (el.requestFullscreen) {
                el.requestFullscreen().catch(() => {});

        function captureFreezeFrame() {
            if (isThumbnailMode) {
                return false;
            }
            if (!remoteVideo || remoteVideo.videoWidth <= 0 || remoteVideo.videoHeight <= 0) {
                return false;
            }
            if (
                freezeFrameCanvas.width !== remoteVideo.videoWidth ||
                freezeFrameCanvas.height !== remoteVideo.videoHeight
            ) {
                freezeFrameCanvas.width = remoteVideo.videoWidth;
                freezeFrameCanvas.height = remoteVideo.videoHeight;
            }
            freezeCtx.setTransform(1, 0, 0, 1, 0, 0);
            freezeCtx.drawImage(remoteVideo, 0, 0, freezeFrameCanvas.width, freezeFrameCanvas.height);
            hasFrozenFrame = true;
            lastSnapshotAt = Date.now();
            return true;
        }

        function stopSnapshotLoop() {
            frameCaptureLoopActive = false;
            if (snapshotIntervalTimer) {
                clearInterval(snapshotIntervalTimer);
                snapshotIntervalTimer = null;
            }
        }

        function showLiveVideo() {
            // 正常播放：直接看 <video>，不要靠 canvas 取樣（CEF rvfc 會停 → 假停格）
            if (isThumbnailMode) {
                return;
            }
            if (wanActive) {
                return;
            }
            remoteVideo.style.opacity = "1";
            freezeFrameCanvas.style.display = "none";
        }

        function startSnapshotLoop() {
            if (isThumbnailMode) {
                return;
            }
            // 備援：背景偶爾抓一幀給真斷線時停格用；顯示仍以 live video 為主
            showLiveVideo();
            stopSnapshotLoop();
            frameCaptureLoopActive = true;
            snapshotIntervalTimer = setInterval(() => {
                if (!frameCaptureLoopActive) {
                    return;
                }
                if (hasLiveVideo() && !remoteVideo.paused) {
                    captureFreezeFrame();
                }
            }, 500);
        }

            captureFreezeFrame();
