        function hubWsHostForPort(port) {
            return defaultWsHostForPort(port);
        }

        function hubChannelHref(port, forThumb) {
            // 每格自己的 signal zrok = ws + feed（畫面跟頻道綁定）
            const feed = defaultFeedForPort(port);
            const ws = hubWsHostForPort(port);
            const q = new URLSearchParams();
            q.set("port", String(port));
            q.set("ws", ws);
            q.set("wan", "1");
            q.set("feed", feed);
            if (forThumb) {
                q.set("thumb", "1");
                q.set("fps", String(urlParams.get("thumbFps") || 10));
                q.set("osc", "0");
            }
            // GH Pages SPA：/321?... ；本機 root：/?port=
            if (onGithubPagesEarly) {
                const base = window.location.pathname.replace(/\/?$/, "/");
                return `${base}${port}?${q.toString()}`;
            }
            return `/?${q.toString()}`;
        }

        function renderPreviewHeaderByPorts(ports) {
            if (!ports.length) {
                previewStrip.innerHTML = "<div style=\"color:#8a8a8a;font-size:13px;padding:0 4px;\">尚未偵測到可用推送畫面</div>";
                previewHeader.style.display = "block";
                if (!isHubEntry) {
                    fullscreenContainer.style.top = "0";
                    fullscreenContainer.style.height = "100vh";
                }
                lastRenderedPreviewKey = "";
                return;
            }

            const portsKey = (isHubEntry ? "hub|" : "local|") + ports.join(",");
            if (portsKey === lastRenderedPreviewKey) {
                return;
            }
            lastRenderedPreviewKey = portsKey;

            clearPreviewSnapTimers();
            previewStrip.innerHTML = "";
            // 主頁／總覽：只刷 live.jpg 快照，不 iframe、不 WS、不播放
            // 首頁預覽預設 5 秒刷一幀
            const snapMs = Math.max(
                1000,
                Number(urlParams.get("snapMs") || (isHubEntry ? 5000 : 3000))
            );
            for (const port of ports) {
                const card = document.createElement("a");
                card.className = "preview-card";
                card.href = hubChannelHref(port, false);
                card.target = "_self";
                card.title = `channel ${port}`;

                const placeholder = document.createElement("div");
                placeholder.className = "preview-placeholder";
                placeholder.textContent = "";

                const img = document.createElement("img");
                img.className = "preview-snap";
                img.alt = "";
                img.setAttribute("aria-hidden", "true");
                img.decoding = "async";
                img.loading = "eager";
                const feed = defaultFeedForPort(port).replace(/\/$/, "");
                let snapBusy = false;
                let failStreak = 0;
                const showSnap = () => {
                    failStreak = 0;
                    placeholder.textContent = "";
                    img.classList.add("is-live");
                    card.classList.add("has-live");
                };
                const markClosed = () => {
                    placeholder.textContent = "通道關閉";
                    img.removeAttribute("src");
                    img.classList.remove("is-live");
                    card.classList.remove("has-live");
                };
                const attachSnap = () => {
                    if (!img.isConnected || snapBusy) {
                        return;
                    }
                    snapBusy = true;
                    const url = feed + "/live.jpg?_=" + Date.now();
                    const pre = new Image();
                    pre.onload = () => {
                        snapBusy = false;
                        if (!img.isConnected) {
                            return;
                        }
                        img.src = url;
                        showSnap();
                    };
                    pre.onerror = () => {
                        snapBusy = false;
                        if (!img.isConnected) {
                            return;
                        }
                        failStreak += 1;
                        if (card.classList.contains("has-live")) {
                            return;
                        }
                        if (failStreak >= 8) {
                            markClosed();
                        }
                    };
                    pre.src = url;
                };
                const kick = window.setTimeout(attachSnap, (Number(port) % 10) * 150);
                previewSnapTimers.push(kick);
                previewSnapTimers.push(setInterval(attachSnap, snapMs));
                card.appendChild(placeholder);
                card.appendChild(img);

                const label = document.createElement("div");
                label.className = "preview-card-label";
                label.textContent = String(port);
                card.appendChild(label);
                previewStrip.appendChild(card);
            }

            previewHeader.style.display = "block";
            if (isHubEntry) {
                document.body.classList.add("hub-entry");
                fullscreenContainer.style.display = "none";
                try {
                    document.getElementById("connect-panel")?.classList.remove("show");
                } catch (e) {}
                return;
            }
            requestAnimationFrame(() => {
                const headerHeight = Math.max(132, previewHeader.offsetHeight || 132);
                fullscreenContainer.style.top = `${headerHeight}px`;
                fullscreenContainer.style.height = `calc(100vh - ${headerHeight}px)`;
            });
        }

        function probeLiveFeed(feedBase, timeoutMs = 2500) {
            return new Promise((resolve) => {
                const base = String(feedBase || "").replace(/\/$/, "");
                if (!base) {
                    resolve(false);
                    return;
                }
                const img = new Image();
                const timer = setTimeout(() => {
                    try {
                        img.onload = null;
                        img.onerror = null;
                        img.src = "";
                    } catch (e) {}
                    resolve(false);
                }, timeoutMs);
                img.onload = () => {
                    clearTimeout(timer);
                    resolve(true);
                };
                img.onerror = () => {
                    clearTimeout(timer);
                    resolve(false);
                };
                img.src = base + "/live.jpg?_=" + Date.now();
            });
        }

        async function probeHttpPort(host, port, timeoutMs = 900) {
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), timeoutMs);
            try {
                // no-cors 模式：只要能連到該 port，就會 resolve（回傳 opaque response）
                await fetch(`http://${host}:${port}/`, { mode: "no-cors", cache: "no-store", signal: controller.signal });
                return true;
            } catch {
                return false;
            } finally {
                clearTimeout(timeout);
            }
        }

        async function discoverOpenPreviewPorts() {
            const host = window.location.hostname;
            const foundPorts = [];
            const scanBatch = async (from, to) => {
                const tasks = [];
                for (let port = from; port <= to; port += 1) {
                    tasks.push(probeHttpPort(host, port).then((ok) => (ok ? port : null)));
                }
                const results = await Promise.all(tasks);
                return results.filter((p) => p !== null);
            };

            // 指定 thumbTo 時，掃固定範圍。
            if (previewScanTo > 0) {
                const from = Math.max(1, Math.min(previewScanFrom, previewScanTo));
                const to = Math.max(previewScanFrom, previewScanTo);
                return await scanBatch(from, to);
            }

            // 不指定 thumbTo 時，動態向上掃描直到連續未命中達到門檻。
            let currentFrom = Math.max(1, previewScanFrom);
            let consecutiveMisses = 0;

            while (currentFrom <= previewHardMax && consecutiveMisses < previewMissStop) {
                const currentTo = Math.min(currentFrom + previewScanChunk - 1, previewHardMax);
                const batchFound = await scanBatch(currentFrom, currentTo);
                if (batchFound.length) {
                    foundPorts.push(...batchFound);
                    consecutiveMisses = 0;
                } else {
                    consecutiveMisses += currentTo - currentFrom + 1;
                }
                currentFrom = currentTo + 1;
            }

            return foundPorts;
        }

        function parsePortList(raw) {
            return String(raw || "")
                .split(",")
                .map((p) => p.trim())
                .filter((p) => /^\d+$/.test(p))
                .map((p) => Number(p));
        }

        function defaultHubPortCandidates() {
            const listed = parsePortList(urlParams.get("hubPorts") || "");
            if (listed.length) {
                return listed;
            }
            const from = Math.max(1, Number(urlParams.get("hubFrom") || 321));
            const to = Math.max(from, Number(urlParams.get("hubTo") || 369));
            const out = [];
            for (let p = from; p <= to; p++) {
                out.push(p);
            }
            return out;
        }

        async function discoverHubAlivePorts() {
            const candidates = defaultHubPortCandidates();
            const alive = [];
            const batchSize = 3;
            for (let i = 0; i < candidates.length; i += batchSize) {
                const batch = candidates.slice(i, i + batchSize);
                await Promise.all(
                    batch.map(async (port) => {
                        const ok = await probeLiveFeed(defaultFeedForPort(port), 4000);
                        if (ok) {
                            alive.push(port);
                        }
                    })
                );
            }
            alive.sort((a, b) => a - b);
            return alive;
        }

        async function syncHubPreviewPorts() {
            const alive = await discoverHubAlivePorts();
            const aliveSet = new Set(alive);
            for (const p of alive) {
                hubPortMiss[p] = 0;
                if (!hubStickyPorts.includes(p)) {
                    hubStickyPorts.push(p);
                }
            }
            hubStickyPorts = hubStickyPorts.filter((p) => {
                if (aliveSet.has(p)) {
                    return true;
                }
                hubPortMiss[p] = (hubPortMiss[p] || 0) + 1;
                return hubPortMiss[p] < 3;
            });
            hubStickyPorts.sort((a, b) => a - b);
            renderPreviewHeaderByPorts(hubStickyPorts);
        }

        async function buildPreviewHeader() {
            if (isThumbnailMode) {
                return;
            }
            let manual = parsePortList(urlParams.get("ports") || urlParams.get("thumbPorts") || "");
            if (!manual.length && isHubEntry) {
                await syncHubPreviewPorts();
                return;
            }
            if (manual.length) {
                renderPreviewHeaderByPorts(manual);
                return;
            }
            if (isHubEntry) {
                renderPreviewHeaderByPorts([]);
                return;
            }

            if (!isRootOverviewPage) {
                return;
            }

            const autoPorts = await discoverOpenPreviewPorts();
            renderPreviewHeaderByPorts(autoPorts);
        }

        class SignalingClient {
            constructor(url, port, onMessage, onOpen, onClose, onError) {
                this.url = url;
                this.port = port;
                this.onMessage = onMessage;
                this.onOpen = onOpen;
                this.onClose = onClose;
                this.onError = onError;
                this.webSocket = null;
                this.properties = {};
                this.id = null;
                this.webRTCConnection = null;
            }

            setWebRTCConnection(connection) {
                this.webRTCConnection = connection;
            }

            open() {
                if (
                    this.webSocket &&
                    (this.webSocket.readyState === WebSocket.OPEN || this.webSocket.readyState === WebSocket.CONNECTING)
                ) {
                    return;
                }

                // GitHub Pages 為 HTTPS：只能連 wss，否則 mixed content 直接被擋
                const pageIsSecure = window.location.protocol === "https:";
                const forceWss =
                    pageIsSecure ||
                    this.url.startsWith("https") ||
                    this.url.startsWith("wss");
                const protocol = forceWss ? "wss" : "ws";
                let host = this.url
                    .replace(/^ws:\/\//, "")
                    .replace(/^wss:\/\//, "")
                    .replace(/^https:\/\//, "")
                    .replace(/^http:\/\//, "");
                // 允許 ?ws=host:443 省略 port 參數
                let port = this.port;
                const hostPortMatch = host.match(/^([^:/]+)(?::(\d+))?$/);
                if (hostPortMatch) {
                    host = hostPortMatch[1];
                    if (hostPortMatch[2]) {
                        port = hostPortMatch[2];
                    }
                }
                const fullUrl = `${protocol}://${host}:${port}`;

                log(`連接 Signaling: ${fullUrl}`);
                this._intentionalClose = false;
                this.webSocket = new WebSocket(fullUrl);

                this.webSocket.onopen = () => {
                    this.onOpen();
                };

                this.webSocket.onmessage = (event) => {
                    try {
                        const message = JSON.parse(event.data);
                        if (message.signalingType === "ClientEntered") {
                            this.id = message.content?.self?.id;
                            this.properties = message.content?.self?.properties || {};
                            myId = this.id;
                        }
                        this.onMessage(message);
                    } catch (e) {
                        log(`Signaling 訊息解析失敗: ${e.message}`, "error");
                    }
                };

                this.webSocket.onclose = () => {
                    initialClientListReceived = false;
                    // 主動 teardown 關的，不要觸發重連（否則會連環開新 WS）
                    if (this._intentionalClose) {
                        return;
                    }
                    this.onClose();
                };

                this.webSocket.onerror = () => {
                    if (this._intentionalClose) {
                        return;
                    }
                    log("WebSocket 錯誤，請檢查 IP/Port", "error");
                    this.onError();
                };
            }

            send(messageString) {
                if (this.webSocket && this.webSocket.readyState === WebSocket.OPEN) {
                    this.webSocket.send(messageString);
                }
            }

            close() {
                if (!this.webSocket) {
                    return;
                }
                this._intentionalClose = true;
                try {
                    this.webSocket.onopen = null;
                    this.webSocket.onmessage = null;
                    this.webSocket.onclose = null;
                    this.webSocket.onerror = null;
                    this.webSocket.close();
                } catch (error) {
                    log(`關閉 WebSocket 失敗: ${error.message}`, "error");
                }
                this.webSocket = null;
            }

            onWebSocketMessageReceived(message) {
                switch (message.signalingType) {
                    case "Clients": {
                        const clients = message.content?.clients || [];
                        if (!initialClientListReceived && clients.length > 0) {
                            initialClientListReceived = true;
                            const firstClient = clients.find((c) => c.id !== myId);
                            if (firstClient && !this.webRTCConnection?.peerConnection) {
                                this.webRTCConnection.onCallStart(firstClient.address, firstClient.properties);
                            }
                        }
                        break;
                    }
                    case "ClientEnter":
                        if (this.webSocket && this.webSocket.readyState === WebSocket.OPEN) {
                            this.send(JSON.stringify({ signalingType: "GetClients" }));
                        }
                        break;
                    case "ClientEntered":
                        this.id = message.content?.self?.id;
                        this.properties = message.content?.self?.properties || {};
                        myId = this.id;
                        break;
                    default:
                        if (this.webRTCConnection && ["Offer", "Answer", "Ice"].includes(message.signalingType)) {
                            this.webRTCConnection.onMessageReceived(message);
                        }
                        break;
                }
            }
        }

        class WebRTCConnection {
            constructor(signalingClientInstance) {
                this.signalingClient = signalingClientInstance;
                this.signalingClient.setWebRTCConnection(this);
                this.peerConnection = null;
                this.makingOffer = false;
                this.polite = false;
                this.target = null;
            }

            setupDataChannels() {
                if (isThumbnailMode) {
                    return;
                }
                try {
                    this.peerConnection.createDataChannel("MouseData");
                    this.peerConnection.createDataChannel("KeyboardData");
                    if (oscBridgeEnabled) {
                        wireOscDataChannel(this.peerConnection.createDataChannel("OscData"));
                    }
                } catch (error) {
                    log(`資料通道建立失敗: ${error.message}`, "error");
                }
            }

            createPeerConnection() {
                this.peerConnection = new RTCPeerConnection({
                    iceServers: [
                        { urls: "stun:stun.l.google.com:19302" },
                        { urls: "stun:stun1.l.google.com:19302" },
                        // 外網 / 跨網卡（Wi-Fi vs ZeroTier）時 STUN 不夠，需 TURN 才有畫面
                        {
                            urls: [
                                "turn:openrelay.metered.ca:80",
                                "turn:openrelay.metered.ca:443",
                                "turn:openrelay.metered.ca:443?transport=tcp"
                            ],
                            username: "openrelayproject",
                            credential: "openrelayproject"
                        }
                    ]
                });

                this.peerConnection.onicecandidate = ({ candidate }) => {
                    if (candidate && this.target) {
                        this.sendSignalingMessage("Ice", {
                            sdpCandidate: candidate.candidate,
                            sdpMLineIndex: candidate.sdpMLineIndex,
                            sdpMid: candidate.sdpMid
                        });
                    }
                };

                this.peerConnection.ontrack = ({ track, streams }) => {
                    const stream = (streams && streams[0]) || null;
                    if (!stream) {
                        return;
                    }
                    // 影音都掛上同一個 video 元素（避免只吃到 video track）
                    if (!remoteVideo.srcObject) {
                        remoteVideo.srcObject = stream;
                    } else {
                        const cur = remoteVideo.srcObject;
                        stream.getTracks().forEach((t) => {
                            if (!cur.getTracks().some((x) => x.id === t.id)) {
                                try {
                                    cur.addTrack(t);
                                } catch (e) {}
                            }
                        });
                    }
                    if (track.kind === "video") {
                        lastTrackAt = Date.now();
                        startSnapshotLoop();
                        track.onended = () => {
                            captureFreezeFrame();
                            showFreezeFrame();
                            // 影軌結束：只停格，不要拆整條 Signaling（會刷 currentClients）
                        };
                    }
                    if (track.kind === "audio") {
                        track.onended = () => {
                            // 音軌死掉立刻靜音，避免卡住最後 sample 爆音
                            silenceMediaBeforeTeardown();
                        };
                        track.onmute = () => {
                            try {
                                remoteVideo.muted = true;
                                remoteVideo.volume = 0;
                            } catch (e) {}
                        };
                    }
                    const playMedia = () => {
                        remoteVideo.muted = false;
                        remoteVideo.volume = 1;
                        const kick = () => {
                            remoteVideo.muted = false;
                            remoteVideo.volume = 1;
                            showLiveVideo();
                            if (track.kind === "video") {
                                startSnapshotLoop();
                            }
                        };
                        const p = remoteVideo.play();
                        if (p && p.then) {
                            p.then(kick).catch(() => {
                                remoteVideo.play().then(kick).catch(kick);
                            });
                        } else {
                            kick();
                        }
                    };
                    if (track.kind === "video" || track.kind === "audio") {
                        playMedia();
                    }
                };

                this.peerConnection.onnegotiationneeded = async () => {
                    if (!this.target) {
                        return;
                    }
                    try {
                        this.makingOffer = true;
                        await this.peerConnection.setLocalDescription();
                        this.sendSignalingMessage("Offer", { sdp: this.peerConnection.localDescription.sdp });
                    } catch (err) {
                        log(`Negotiation 失敗: ${err.message}`, "error");
                    } finally {
                        this.makingOffer = false;
                    }
                };

                this.peerConnection.onconnectionstatechange = () => {
                    if (!this.peerConnection) {
                        return;
                    }
                    const state = this.peerConnection.connectionState;
                    try {
                        postLinkState({ pc: state });
                    } catch (e) {}
                    if (state === "failed" || state === "closed") {
                        captureFreezeFrame();
                        showFreezeFrame();
                        try {
                            postLinkState({ ok: 0, live: 0, pc: state });
                        } catch (e) {}
                        this.deletePeerConnection();
                        // 不重連 Signaling
                        log("PeerConnection " + state + " — no auto reconnect", "warn");
                    } else if (state === "disconnected") {
                        // ICE 短暫 disconnected：只記狀態，不要立刻停格/拆線
                        try {
                            postLinkState({ pc: state });
                        } catch (e) {}
                        const pc = this.peerConnection;
                        setTimeout(() => {
                            if (pc && pc.connectionState === "disconnected") {
                                captureFreezeFrame();
                                showFreezeFrame();
                                try {
                                    postLinkState({ ok: 0, live: 0, pc: state });
                                } catch (e) {}
                                this.deletePeerConnection();
                                log("PeerConnection disconnected — no auto reconnect", "warn");
                            } else if (pc && pc.connectionState === "connected") {
                                showLiveVideo();
                            }
                        }, 3000);
                    }
                };

                this.peerConnection.ondatachannel = (ev) => {
                    const ch = ev.channel;
                    log(`DataChannel 已連入: ${ch.label}`, "success");
                    if (ch.label === "OscData") {
                        wireOscDataChannel(ch);
                        return;
                    }
                    wireDataChannelToTdSignal(ch);
                };
                this.peerConnection.addTransceiver("video", { direction: "recvonly" });
                if (!isThumbnailMode) {
                    this.peerConnection.addTransceiver("audio", { direction: "recvonly" });
                    this.peerConnection.addTransceiver("video", { direction: "sendonly" });
                }
            }

            deletePeerConnection() {
                captureFreezeFrame();
                showFreezeFrame();
                // ★ 斷線先靜音再拆 track，否則 CEF/audiowebrender 會卡住最後一個 sample → 爆音
                silenceMediaBeforeTeardown();
                if (this.peerConnection) {
                    try {
                        this.peerConnection.close();
                    } catch (error) {
                        log(`關閉 PeerConnection 失敗: ${error.message}`, "error");
                    }
                    this.peerConnection = null;
                }

                if (remoteVideo.srcObject) {
                    remoteVideo.srcObject.getTracks().forEach((track) => track.stop());
                    remoteVideo.srcObject = null;
                }
                this.target = null;
            }

            onCallStart(targetAddress, targetProperties) {
                if (this.peerConnection) {
                    return;
                }
                this.target = targetAddress;
                const myTimeJoined = this.signalingClient.properties.timeJoined || 0;
                const targetTimeJoined = targetProperties.timeJoined || 0;
                this.polite = myTimeJoined > targetTimeJoined;
                this.createPeerConnection();
                this.setupDataChannels();
            }

            async onMessageReceived(message) {
                if (!message.content || (!this.target && message.signalingType !== "Offer")) {
                    return;
                }

                if (!this.peerConnection && message.signalingType === "Offer") {
                    this.polite = true;
                    this.target = message.sender;
                    this.createPeerConnection();
                    this.setupDataChannels();
                } else if (!this.peerConnection) {
                    return;
                }

                try {
                    if (message.signalingType === "Offer") {
                        this.target = message.sender;
                        const offerCollision = this.makingOffer || this.peerConnection.signalingState !== "stable";
                        const ignoreOffer = !this.polite && offerCollision;
                        if (ignoreOffer) {
                            return;
                        }
                        await this.peerConnection.setRemoteDescription({ type: "offer", sdp: message.content.sdp });
                        await this.peerConnection.setLocalDescription();
                        this.sendSignalingMessage("Answer", { sdp: this.peerConnection.localDescription.sdp });
                    } else if (message.signalingType === "Answer") {
                        await this.peerConnection.setRemoteDescription({ type: "answer", sdp: message.content.sdp });
                    } else if (message.signalingType === "Ice") {
                        if (!message.content.sdpCandidate) {
                            return;
                        }
                        const candidate = new RTCIceCandidate({
                            candidate: message.content.sdpCandidate,
                            sdpMLineIndex: message.content.sdpMLineIndex,
                            sdpMid: message.content.sdpMid
                        });
                        await this.peerConnection.addIceCandidate(candidate);
                    }
                } catch (err) {
                    log(`WebRTC 訊息處理失敗: ${err.message}`, "error");
                }
            }

            sendSignalingMessage(type, content) {
                if (!this.target) {
                    return;
                }
                const message = {
                    metadata: {
                        apiVersion: "1.0.1",
                        compVersion: "1.0.1",
                        compOrigin: "WebRTC",
                        projectName: "TDWebRTCWebDemo"
                    },
                    signalingType: type,
                    sender: null,
                    target: this.target,
                    content
                };
                this.signalingClient.send(JSON.stringify(message));
            }
        }

        function startTdSignalPolling() {
            if (tdSignalTimer) {
                clearInterval(tdSignalTimer);
                tdSignalTimer = null;
            }
            if (!Number.isFinite(signalPollMs) || signalPollMs <= 0) {
                return;
            }
            const tick = async () => {
                if (window.__tdShuttingDown) {
                    return;
                }
                const sigSlug = (urlParams.get("signalKey") || urlParams.get("sig") || "").trim();
                const sigPort = (urlParams.get("port") || "").trim();
                const slugOk = (s) => /^[a-zA-Z0-9_-]{1,64}$/.test(s);
                let name = "signal.json";
                if (sigSlug && slugOk(sigSlug)) {
                    name = `signal_${sigSlug}.json`;
                } else if (sigPort && slugOk(sigPort)) {
                    name = `signal_${sigPort}.json`;
                }
                const u = new URL(name, window.location.href);
                u.searchParams.set("_", String(Date.now()));
                let res;
                try {
                    res = await fetch(u.toString(), { cache: "no-store" });
                } catch {
                    return;
                }
                if (res.status === 404) {
                    return;
                }
                if (!res.ok) {
                    return;
                }
                let data;
                try {
                    data = await res.json();
                } catch {
                    return;
                }
                const seq = Number(data.seq);
                if (!Number.isFinite(seq) || seq === lastTdSignalSeq) {
                    return;
                }
                lastTdSignalSeq = seq;
                window.dispatchEvent(new CustomEvent("tdsignal", { detail: data }));
            };
            tick();
            tdSignalTimer = setInterval(tick, Math.max(50, signalPollMs));
        }

        const LS_WS = "mywebrtc_ws_host";
        const LS_PORT = "mywebrtc_td_port"; // 存 TD 通道號（與 COMP Port 同步），不是 443

        function normalizeWsHost(raw) {
            let h = String(raw || "").trim();
            h = h.replace(/^wss?:\/\//i, "").replace(/^https?:\/\//i, "");
            h = h.replace(/\/.*$/, "");
            // host:443 / host:321 → 只留 host（真正 dial port 另算）
            const hp = h.match(/^([^:/]+)/);
            return hp ? hp[1] : h;
        }

        function isLanIpv4(host) {
            return /^\d{1,3}(\.\d{1,3}){3}$/.test(host);
        }

        function isPublicTunnelHost(host) {
            return (
                /\.share\.zrok\.io$/i.test(host) ||
                /\.zrok\.io$/i.test(host) ||
                /\.trycloudflare\.com$/i.test(host) ||
                /\.ngrok(-free)?\.(app|io)$/i.test(host)
            );
        }

        /**
         * ?port= 永遠 = TD 通道號（321/322…）
         * 真正 WebSocket dial：
         *   - 本機 / 區網 IP → 同號（ws://ip:321）
         *   - tunnel / HTTPS 公網 host → 443（可用 ?wsp= 覆寫）
         */
        function resolveDialPort(tdPort, host) {
            const wsp = (urlParams.get("wsp") || urlParams.get("wsport") || "").trim();
            if (wsp && /^\d{1,6}$/.test(wsp)) {
                return wsp;
            }
            if (isLanIpv4(host)) {
                return String(tdPort);
            }
            if (isPublicTunnelHost(host) || window.location.protocol === "https:") {
                return "443";
            }
            return String(tdPort);
        }

        function showConnectPanel(msg) {
            const panel = document.getElementById("connect-panel");
            const status = document.getElementById("connect-status");
            const wsInput = document.getElementById("connect-ws");
            const portInput = document.getElementById("connect-port");
            if (!panel) {
                return;
            }
            panel.classList.add("show");
            panel.setAttribute("aria-hidden", "false");
            try {
                const savedHost = localStorage.getItem(LS_WS) || "";
                const savedPort = localStorage.getItem(LS_PORT) || "321";
                if (wsInput && !wsInput.value) {
                    wsInput.value = savedHost;
                }
                if (portInput) {
                    // 舊版把 443 存進 LS：自動改回 321
                    const n = String(savedPort || "321");
                    portInput.value = n === "443" ? "321" : n;
                }
            } catch (e) {}
            if (status) {
                status.className = "";
                status.textContent = msg || "";
            }
            if (wsInput) {
                setTimeout(() => wsInput.focus(), 50);
            }
        }

        function hideConnectPanel() {
            const panel = document.getElementById("connect-panel");
            if (!panel) {
                return;
            }
            panel.classList.remove("show");
            panel.setAttribute("aria-hidden", "true");
        }

        function beginWatch(host, tdPortRaw, { persist = true, rewriteUrl = true } = {}) {
            const h = normalizeWsHost(host);
            let tdPort = String(tdPortRaw || "").trim();
            // 相容舊書籤：有人把 port=443 當 dial port → 當沒填通道，改 321
            if (!tdPort || tdPort === "443") {
                tdPort = "321";
            }
            if (!/^\d{1,6}$/.test(tdPort)) {
                showConnectPanel("TD Port 請填與 TouchDesigner 相同的通道號（例如 321）");
                return false;
            }
            if (!h) {
                showConnectPanel("請填 Signaling Host（例如 xxx.share.zrok.io）");
                return false;
            }
            if (isLanIpv4(h) && window.location.protocol === "https:") {
                showConnectPanel(
                    "GitHub Pages 是 HTTPS，不能直連區網 IP。\n" +
                    "請填 zrok / tunnel 主機（例如 xxx.share.zrok.io）。"
                );
                return false;
            }
            const dialPort = resolveDialPort(tdPort, h);
            wsHost = h;
            wsPort = dialPort;
            if (persist) {
                try {
                    localStorage.setItem(LS_WS, h);
                    localStorage.setItem(LS_PORT, tdPort);
                } catch (e) {}
            }
            if (rewriteUrl) {
                const u = new URL(window.location.href);
                u.searchParams.set("ws", h);
                u.searchParams.delete("wsp");
                if (onGithubPagesEarly || /\.share\.zrok\.io$/i.test(window.location.hostname)) {
                    // 通用 path：/MyWebRTC/321?ws=…
                    u.pathname = appBasePath.replace(/\/?$/, "/") + tdPort;
                    u.searchParams.delete("port");
                } else {
                    u.searchParams.set("port", tdPort);
                }
                history.replaceState(null, "", u.toString());
            }
            hideConnectPanel();
            const status = document.getElementById("connect-status");
            if (status) {
                status.className = "ok";
                status.textContent =
                    dialPort === String(tdPort)
                        ? `連接 TD 通道 ${tdPort} → ${h}:${dialPort}`
                        : `連接 TD 通道 ${tdPort} → ${h}:443（tunnel；邏輯埠 ${tdPort}）`;
            }
            connect();
            setTimeout(() => {
                tryEnterFullscreen();
            }, 500);
            return true;
        }

        function wireConnectPanel() {
            const go = document.getElementById("connect-go");
            const wsInput = document.getElementById("connect-ws");
            const portInput = document.getElementById("connect-port");
            if (!go) {
                return;
            }
            const submit = () => {
                beginWatch(wsInput && wsInput.value, portInput && portInput.value);
            };
            go.addEventListener("click", submit);
            [wsInput, portInput].forEach((el) => {
                if (!el) {
                    return;
                }
                el.addEventListener("keydown", (ev) => {
                    if (ev.key === "Enter") {
                        submit();
                    }
                });
            });
        }

        function start() {
            // 總覽頁不進 Signaling
            if (isRootOverviewPage) {
                log("overview: skip signaling connect");
                return;
            }
            // thumb：靜態 live.jpg（不 WS 播放）
            if (isThumbnailMode) {
                log("thumb: static live.jpg only");
                document.body.style.overflow = "hidden";
                try {
                    if (previewHeader) {
                        previewHeader.style.display = "none";
                    }
                } catch (e) {}
                const feed = (feedBase || defaultFeedForPort(pathTdPort || urlParams.get("port") || "321")).replace(
                    /\/$/,
                    ""
                );
                if (wanVideo) {
                    wanVideo.classList.add("show");
                    const bump = () => {
                        wanVideo.src = feed + "/live.jpg?_=" + Date.now();
                    };
                    bump();
                    wanTimer = setInterval(bump, Math.max(800, Number(urlParams.get("snapMs") || 2000)));
                }
                return;
            }
            const wsParam = (urlParams.get("ws") || "").trim();
            const onGithubPages = /\.github\.io$/i.test(window.location.hostname);
            const tdPort = pathTdPort || urlParams.get("port") || defaultPort;

            // GH 入口 /MyWebRTC/：多窗快照（buildPreviewHeader），不彈連線面板
            if (isHubEntry) {
                log("hub entry: vertical snapshot wall");
                document.body.classList.add("hub-entry");
                return;
            }

            const port = tdPort || "321";
            const onZrok = /\.share\.zrok\.io$/i.test(window.location.hostname);

            if (!onGithubPages && onZrok) {
                const wsHostAuto = wsParam || defaultWsHostForPort(port);
                armWanFallback();
                beginWatch(wsHostAuto, port, {
                    persist: false,
                    rewriteUrl: false
                });
                return;
            }

            // 本機 TD WebServer
            if (!onGithubPages) {
                wsHost = wsParam || window.location.hostname;
                wsPort = resolveDialPort(tdPort, wsHost);
                armWanFallback();
                connect();
                setTimeout(() => {
                    tryEnterFullscreen();
                }, 500);
                return;
            }

            // GitHub Pages 最短：/MyWebRTC/321
            const wsHostAuto = wsParam || defaultWsHostForPort(port);
            armWanFallback();
            beginWatch(wsHostAuto, port, {
                persist: Boolean(wsParam),
                rewriteUrl: false
            });
        }

        function silenceMediaBeforeTeardown() {
            // 順序很重要：先 mute/volume=0 → disable audio tracks → 再 stop
            try {
                remoteVideo.muted = true;
                remoteVideo.volume = 0;
            } catch (e) {}
            try {
                remoteVideo.pause();
            } catch (e) {}
            const stream = remoteVideo.srcObject;
            if (!stream) {
                return;
            }
            try {
                stream.getAudioTracks().forEach((t) => {
                    try {
                        t.enabled = false;
                    } catch (e) {}
                });
            } catch (e) {}
        }

        function resetMediaView() {
            // 停 snapshot 取樣，但保留 canvas 最後一幀（不要 load() 清畫面）
            stopSnapshotLoop();
            silenceMediaBeforeTeardown();
            if (remoteVideo.srcObject) {
                remoteVideo.srcObject.getTracks().forEach((track) => track.stop());
                remoteVideo.srcObject = null;
            }
            // 刻意不 remoteVideo.load()，避免 CEF 整頁閃黑
        }

        function clearReconnectTimer() {
            if (!reconnectTimer) {
                return;
            }
            clearTimeout(reconnectTimer);
            reconnectTimer = null;
        }

        function clearConnectWatchdog() {
            if (!connectWatchdogTimer) {
                return;
            }
            clearTimeout(connectWatchdogTimer);
            connectWatchdogTimer = null;
        }

        function clearMediaWatchdog() {
            if (!mediaWatchdogTimer) {
                return;
            }
            clearInterval(mediaWatchdogTimer);
            mediaWatchdogTimer = null;
        }

        function hasLiveVideo() {
            return Boolean(
                remoteVideo.srcObject &&
                remoteVideo.srcObject.getVideoTracks().some((t) => t.readyState === "live")
            );
        }

        function liveJpgUrl() {
            const base = feedBase || window.location.origin;
            return base.replace(/\/$/, "") + "/live.jpg?_=" + Date.now();
        }

        function liveWsUrl() {
            const base = feedBase || window.location.origin;
            return base.replace(/^http/i, "ws").replace(/\/$/, "") + "/";
        }

        function paintWanJpeg(buf) {
            if (wanBusy || !buf) {
                return;
            }
            wanBusy = true;
            createImageBitmap(new Blob([buf], { type: "image/jpeg" }))
                .then((bmp) => {
                    if (
                        freezeFrameCanvas.width !== bmp.width ||
                        freezeFrameCanvas.height !== bmp.height
                    ) {
                        freezeFrameCanvas.width = bmp.width;
                        freezeFrameCanvas.height = bmp.height;
                    }
                    freezeCtx.setTransform(1, 0, 0, 1, 0, 0);
                    freezeCtx.drawImage(bmp, 0, 0);
                    bmp.close();
                    freezeFrameCanvas.style.display = "block";
                    remoteVideo.style.opacity = "0";
                    if (wanVideo) {
                        wanVideo.classList.remove("show");
                    }
                })
                .catch(() => {})
                .finally(() => {
                    wanBusy = false;
                });
        }

        function stopWanPipe() {
            wanActive = false;
            wanMode = "";
            wanBusy = false;
            if (wanTimer) {
                clearInterval(wanTimer);
                wanTimer = null;
            }
            if (wanWs) {
                try {
                    if (wanWs.readyState === WebSocket.OPEN) {
                        wanWs.send(JSON.stringify({ t: "live_off" }));
                    }
                    wanWs.onopen = null;
                    wanWs.onmessage = null;
                    wanWs.onerror = null;
                    wanWs.onclose = null;
                    wanWs.close();
                } catch (e) {}
                wanWs = null;
            }
            if (wanVideo) {
                wanVideo.classList.remove("show");
                wanVideo.removeAttribute("src");
            }
        }

        function startWanJpgFallback(reason) {
            wanMode = "jpg";
            log("WAN HTTP live.jpg @" + wanFps + "fps fallback: " + (reason || ""), "warn");
            setOscHud("外網 live.jpg @" + wanFps + "fps（WS 失敗）");
            if (wanVideo) {
                wanVideo.classList.add("show");
            }
            const kick = () => {
                if (!wanActive || wanMode !== "jpg" || !wanVideo) {
                    return;
                }
                wanVideo.src = liveJpgUrl();
            };
            wanVideo.onload = () => {
                try {
                    freezeFrameCanvas.style.display = "none";
                    remoteVideo.style.opacity = "0";
                } catch (e) {}
            };
            kick();
            const ms = Math.max(16, Math.round(1000 / wanFps));
            wanTimer = setInterval(kick, ms);
        }

        function startWanPipe(reason) {
            if (isHubEntry) {
                return;
            }
            if (wanActive) {
                return;
            }
            wanActive = true;
            try {
                showFreezeFrame();
            } catch (e) {}
            log("WAN WS live @" + wanFps + "fps: " + (reason || ""), "warn");
            setOscHud("外網模式 WS JPEG @" + wanFps + "fps");
            let settled = false;
            const failToJpg = (why) => {
                if (settled || !wanActive) {
                    return;
                }
                settled = true;
                if (wanWs) {
                    try {
                        wanWs.close();
                    } catch (e) {}
                    wanWs = null;
                }
                startWanJpgFallback(why);
            };
            try {
                wanWs = new WebSocket(liveWsUrl());
                wanWs.binaryType = "arraybuffer";
                wanWs.onopen = () => {
                    wanMode = "ws";
                    settled = true;
                    try {
                        wanWs.send(JSON.stringify({ t: "live", fps: wanFps }));
                    } catch (e) {}
                    log("WAN WS open → live @" + wanFps + "fps", "ok");
                };
                wanWs.onmessage = (ev) => {
                    if (!wanActive) {
                        return;
                    }
                    if (ev.data instanceof ArrayBuffer) {
                        paintWanJpeg(ev.data);
                        return;
                    }
                    if (typeof ev.data === "string" && ev.data.indexOf("live_ok") >= 0) {
                        setOscHud("外網 WS live @" + wanFps + "fps OK");
                    }
                };
                wanWs.onerror = () => failToJpg("ws-error");
                wanWs.onclose = () => {
                    if (wanActive && wanMode === "ws") {
                        failToJpg("ws-close");
                    }
                };
                setTimeout(() => {
                    if (wanActive && wanMode !== "ws") {
                        failToJpg("ws-timeout");
                    }
                }, 2500);
            } catch (e) {
                failToJpg(String(e && e.message ? e.message : e));
            }
        }

        function armWanFallback() {
            if (isThumbnailMode || isHubEntry || isRootOverviewPage) {
                return;
            }
            const need =
                forceWan ||
                onGithubPagesEarly ||
                Boolean(feedBase) ||
                (urlParams.get("ws") || "").indexOf("zrok") >= 0;
            if (!need) {
                return;
            }
            if (forceWan || feedBase) {
                startWanPipe("forced");
                return;
            }
            setTimeout(() => {
                if (!hasLiveVideo()) {
                    startWanPipe("webrtc-timeout");
                }
            }, 4500);
        }

        function clearConnectLock() {
            isConnecting = false;
            clearReconnectTimer();
            clearConnectWatchdog();
        }
        window.__tdClearConnectLock = clearConnectLock;

        function startMediaWatchdog() {
            clearMediaWatchdog();
            mediaWatchdogTimer = setInterval(() => {
                if (wanActive) {
                    return;
                }
                const connected = signalingClient?.webSocket?.readyState === WebSocket.OPEN;
                if (!connected) {
                    // 不自動重連
                    return;
                }

                if (hasLiveVideo()) {
                    lastTrackAt = Date.now();
                    // 有 live track：確保顯示 live video，不要卡在停格層
                    if (remoteVideo.style.opacity === "0" || freezeFrameCanvas.style.display === "block") {
                        if (!remoteVideo.paused) {
                            showLiveVideo();
                        }
                    }
                    if (remoteVideo.paused) {
                        remoteVideo.play().catch(() => {});
                    }
                    return;
                }

                // 已連 signaling 但沒 live track：只停格，不要亂拆連線
                showFreezeFrame();
            }, 1000);
        }

        function scheduleReconnect(reason) {
            // ★ 完全停用自動重連
            if (reason) {
                log(`斷線不重連: ${reason}`, "warn");
            }
            return;
        }

        function teardownConnections() {
            if (!isThumbnailMode) {
                captureFreezeFrame();
                showFreezeFrame();
            }
            clearConnectWatchdog();
            clearMediaWatchdog();
            if (webRTCConnection) {
                webRTCConnection.deletePeerConnection();
                webRTCConnection = null;
            }
            if (signalingClient) {
                signalingClient.close();
                signalingClient = null;
            }
            initialClientListReceived = false;
            myId = null;
            lastTrackAt = 0;
            resetMediaView();
            showFreezeFrame();
            try {
                postLinkState({ ok: 0, live: 0, reason: "teardown" });
            } catch (e) {}
        }

        function nowStuckConnecting() {
            return Boolean(
                isConnecting &&
                lastConnectAttemptAt &&
                Date.now() - lastConnectAttemptAt > 6000
            );
        }

        function connect(force = false) {
            if (window.__tdShuttingDown) {
                return;
            }
            if (isConnecting) {
                if (nowStuckConnecting()) {
                    clearConnectLock();
                } else {
                    return;
                }
            }
            lastConnectAttemptAt = Date.now();

            isConnecting = true;
            showFreezeFrame();
            teardownConnections();

            signalingClient = new SignalingClient(
                wsHost,
                wsPort,
                (msg) => signalingClient?.onWebSocketMessageReceived(msg),
                () => {
                    isConnecting = false;
                    reconnectAttempts = 0;
                    clearReconnectTimer();
                    clearConnectWatchdog();
                    startMediaWatchdog();
                    showFreezeFrame();
                    log("Signaling 已連線", "success");
                },
                () => {
                    isConnecting = false;
                    showFreezeFrame();
                    log("Signaling 連線中斷 — 不重連", "warn");
                },
                () => {
                    isConnecting = false;
                    showFreezeFrame();
                    log("Signaling 發生錯誤 — 不重連", "warn");
                }
            );
            webRTCConnection = new WebRTCConnection(signalingClient);
            signalingClient.open();
            clearConnectWatchdog();
            connectWatchdogTimer = setTimeout(() => {
                if (signalingClient?.webSocket?.readyState !== WebSocket.OPEN) {
                    log("Signaling 連線逾時 — 不重連", "warn");
                    isConnecting = false;
                    showFreezeFrame();
                }
            }, watchdogConfig.connectTimeoutMs);
        }

        // 給 TD inject：已停用強制重連（手動重整頁面即可）
        window.__tdForceReconnect = function () {
            log("__tdForceReconnect disabled", "warn");
        };
        window.__tdReconnectIfStale = function (staleMs) {
            return false;
        };

            document.addEventListener("DOMContentLoaded", () => {
            wireConnectPanel();

            const tdSignalHud = document.getElementById("td-signal-hud");
            if (tdSignalHud && signalHudEnabled) {
                tdSignalHud.hidden = false;
                window.addEventListener("tdsignal", (ev) => {
                    const d = ev.detail || {};
                    tdSignalHud.textContent = JSON.stringify(d, null, 0);
                });
            } else if (tdSignalHud) {
                tdSignalHud.remove();
            }

            const oscHud = document.getElementById("osc-hud");
            const oscBtn = document.getElementById("osc-enable-btn");
            if (oscHud) {
                oscHud.remove();
            }
            if (oscBtn) {
                oscBtn.remove();
            }
            if (oscBridgeEnabled) {
                armOscTapToEnable();
            }

            if (isRootOverviewPage || isHubEntry) {
                remoteVideo.muted = true;
                fullscreenContainer.style.display = "none";
                if (isHubEntry) {
                    document.body.classList.add("hub-entry");
                }
                try {
                    document.getElementById("connect-panel")?.classList.remove("show");
                } catch (e) {}
            }
            if (isThumbnailMode) {
                remoteVideo.muted = true;
                remoteVideo.volume = 0;
                remoteVideo.style.opacity = "0";
                freezeFrameCanvas.style.display = "none";
            } else if (!isHubEntry && !isRootOverviewPage) {
                remoteVideo.style.opacity = "1";
                freezeFrameCanvas.style.display = "none";
                remoteVideo.muted = false;
                remoteVideo.volume = 1;
            }
            buildPreviewHeader();
            if (isRootOverviewPage || isHubEntry) {
                if (previewRefreshTimer) {
                    clearInterval(previewRefreshTimer);
                }
                previewRefreshTimer = setInterval(() => {
                    if (isHubEntry) {
                        syncHubPreviewPorts();
                    } else {
                        buildPreviewHeader();
                    }
                }, Math.max(10000, previewRefreshMs));
            } else {
                start();
            }

            remoteVideo.addEventListener("loadeddata", () => {
                showLiveVideo();
                startSnapshotLoop();
            });
            remoteVideo.addEventListener("playing", () => {
                showLiveVideo();
                startSnapshotLoop();
            });
            remoteVideo.addEventListener("emptied", () => {
                stopSnapshotLoop();
            });
            remoteVideo.addEventListener("pause", () => {
                if (hasLiveVideo()) {
                    remoteVideo.play().catch(() => {});
                    return;
                }
                showFreezeFrame();
            });
            remoteVideo.addEventListener("waiting", () => {
                if (hasLiveVideo()) {
                    return;
                }
                showFreezeFrame();
            });

            const unlockAndFullscreen = () => {
                remoteVideo.muted = false;
                remoteVideo.volume = 1;
                remoteVideo.play().catch(() => {});
                tryEnterFullscreen();
            };

            document.addEventListener("click", unlockAndFullscreen, { capture: true });
            document.addEventListener("touchstart", unlockAndFullscreen, { capture: true });

            const hardStopForTdExit = () => {
                window.__tdShuttingDown = true;
                try {
                    stopLinkHeartbeat(true);
                } catch (e) {}
                try {
                    if (tdSignalTimer) {
                        clearInterval(tdSignalTimer);
                        tdSignalTimer = null;
                    }
                } catch (e) {}
                try {
                    if (oscRafId !== null) {
                        cancelAnimationFrame(oscRafId);
                        oscRafId = null;
                    }
                    window.removeEventListener("deviceorientation", onDeviceOrientation, true);
                    window.removeEventListener("devicemotion", onDeviceMotion, true);
                    oscSensorsLive = false;
                    oscDataChannel = null;
                } catch (e) {}
                try {
                    clearReconnectTimer();
                } catch (e) {}
                try {
                    clearConnectWatchdog();
                } catch (e) {}
                try {
                    clearMediaWatchdog();
                } catch (e) {}
                try {
                    stopSnapshotLoop();
                } catch (e) {}
                try {
                    teardownConnections();
                } catch (e) {}
            };
            window.addEventListener("pagehide", hardStopForTdExit);
            window.addEventListener("beforeunload", hardStopForTdExit);

            startTdSignalPolling();
            startLinkHeartbeat();
        });
    </script>
</body>
</html>
